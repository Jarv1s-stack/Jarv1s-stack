<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">JARV1S OS — Ayan's animated profile</title>
  <desc id="desc">A neon terminal interface introducing Ayan, an AI engineering student and full-stack developer from Kazakhstan. A glowing orbital core and blinking terminal cursor animate gently.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071116"/>
      <stop offset=".56" stop-color="#07100f"/>
      <stop offset="1" stop-color="#101020"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b1c"/>
      <stop offset="1" stop-color="#0a1118"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#80ffd5" stop-opacity="0"/>
      <stop offset=".5" stop-color="#80ffd5" stop-opacity=".52"/>
      <stop offset="1" stop-color="#80ffd5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core" cx=".48" cy=".38" r=".72">
      <stop offset="0" stop-color="#173f3b"/>
      <stop offset=".72" stop-color="#0b1c21"/>
      <stop offset="1" stop-color="#091116"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8affdf" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0H4" stroke="#b7fff0" stroke-opacity=".035"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <style>
      text { font-family: Consolas, "SFMono-Regular", "Liberation Mono", monospace; }
      .mint { fill: #80ffd5; }
      .muted { fill: #6fae9f; }
      .copy { fill: #c2ded8; }
      .cursor { animation: blink 1.1s steps(2, start) infinite; }
      .corePulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-in-out infinite; }
      .orbit { transform-box: fill-box; transform-origin: center; animation: rotate 36s linear infinite; }
      .orbitReverse { transform-box: fill-box; transform-origin: center; animation: rotateBack 48s linear infinite; }
      .nodePulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
      .beam { animation: sweep 7s ease-in-out infinite; }
      .barA { animation: barA 3.8s ease-in-out infinite alternate; }
      .barB { animation: barB 4.6s ease-in-out infinite alternate; }
      @keyframes blink { to { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: .62; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.04); } }
      @keyframes rotate { to { transform: rotate(360deg); } }
      @keyframes rotateBack { to { transform: rotate(-360deg); } }
      @keyframes sweep { 0%, 18% { transform: translateY(0); opacity: 0; } 28% { opacity: .35; } 82% { opacity: .18; } 100% { transform: translateY(344px); opacity: 0; } }
      @keyframes barA { from { width: 94px; } to { width: 160px; } }
      @keyframes barB { from { width: 66px; } to { width: 124px; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1000" height="520" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="520" rx="18" fill="url(#grid)"/>
  <rect width="1000" height="520" rx="18" fill="url(#scanlines)"/>
  <rect x="1" y="1" width="998" height="518" rx="18" fill="none" stroke="#28584f" stroke-width="1.5"/>
  <rect x="15" y="15" width="970" height="490" rx="12" fill="none" stroke="#8affdf" stroke-opacity=".12"/>

  <g>
    <circle cx="37" cy="39" r="4" fill="#80ffd5" class="nodePulse"/>
    <text x="51" y="44" class="mint" font-size="13" font-weight="700" letter-spacing="1.5">JARV1S OS</text>
    <text x="146" y="44" class="muted" font-size="12">/ PERSONAL PROFILE</text>
    <text x="955" y="44" class="muted" text-anchor="end" font-size="11" letter-spacing="1">AYAN · KAZAKHSTAN</text>
    <path d="M32 62H968" stroke="#36796a" stroke-opacity=".72"/>
  </g>

  <g>
    <text x="53" y="99" class="muted" font-size="11" letter-spacing="2">01 / INTRODUCTION</text>
    <text x="53" y="151" class="mint" font-size="36" font-weight="700" letter-spacing=".2" filter="url(#glow)">HELLO, WORLD.</text>
    <text x="54" y="183" fill="#e6fff7" font-size="17" font-weight="600" letter-spacing=".6">I BUILD USEFUL SOFTWARE.</text>
    <text x="54" y="209" class="copy" font-size="13">AI engineering student · full-stack developer</text>
    <text x="54" y="231" class="muted" font-size="12">Curious about AI, the web, and how ideas become systems.</text>
  </g>

  <g>
    <rect x="42" y="252" width="540" height="190" rx="9" fill="url(#panel)" stroke="#2b655a" stroke-width="1.2"/>
    <path d="M42 285H582" stroke="#2b655a"/>
    <circle cx="62" cy="269" r="4" fill="#ff7185" fill-opacity=".9"/>
    <circle cx="78" cy="269" r="4" fill="#f4c96b" fill-opacity=".9"/>
    <circle cx="94" cy="269" r="4" fill="#80ffd5" fill-opacity=".9"/>
    <text x="116" y="273" class="muted" font-size="10">~/ayan/mission.log</text>
    <text x="560" y="273" class="muted" text-anchor="end" font-size="10">SESSION 001</text>

    <text x="64" y="316" class="mint" font-size="13">$ <tspan class="copy">whoami</tspan></text>
    <text x="64" y="342" class="copy" font-size="13">Ayan — student, builder, lifelong learner.</text>
    <text x="64" y="371" class="mint" font-size="13">$ <tspan class="copy">focus --current</tspan><tspan class="cursor">▍</tspan></text>

    <text x="64" y="399" fill="#80ffd5" font-size="12">+</text>
    <text x="81" y="399" class="copy" font-size="12">Practical AI and helpful tools</text>
    <text x="64" y="420" fill="#80ffd5" font-size="12">+</text>
    <text x="81" y="420" class="copy" font-size="12">Clear web experiences · ideas shipped in the open</text>
  </g>

  <g>
    <rect x="604" y="82" width="354" height="360" rx="12" fill="url(#panel)" stroke="#2b655a" stroke-width="1.2"/>
    <text x="781" y="111" class="muted" text-anchor="middle" font-size="10" letter-spacing="2">CREATIVE ENGINE / A-01</text>
    <circle cx="781" cy="257" r="106" fill="none" stroke="#80ffd5" stroke-opacity=".055" stroke-width="1"/>
    <circle cx="781" cy="257" r="88" fill="none" stroke="#558f83" stroke-opacity=".35" stroke-width="1"/>
    <circle cx="781" cy="257" r="72" fill="none" stroke="#80ffd5" stroke-opacity=".28" stroke-width="1" stroke-dasharray="2 8" class="orbit"/>
    <ellipse cx="781" cy="257" rx="117" ry="47" fill="none" stroke="#c3a6ff" stroke-opacity=".58" stroke-width="1.2" transform="rotate(-34 781 257)" class="orbitReverse"/>
    <ellipse cx="781" cy="257" rx="117" ry="47" fill="none" stroke="#80ffd5" stroke-opacity=".34" stroke-width="1" transform="rotate(34 781 257)" class="orbit"/>

    <circle cx="781" cy="257" r="57" fill="#80ffd5" fill-opacity=".08" filter="url(#softGlow)" class="corePulse"/>
    <circle cx="781" cy="257" r="47" fill="url(#core)" stroke="#80ffd5" stroke-width="1.5" filter="url(#glow)" class="corePulse"/>
    <path d="M757 239L781 225L805 239V273L781 287L757 273Z" fill="#0e2929" stroke="#80ffd5" stroke-width="1.4"/>
    <path d="M767 252H774M788 252H795" stroke="#80ffd5" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M771 265Q781 274 791 265" fill="none" stroke="#7bdcf5" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M781 225V215M777 215H785" stroke="#80ffd5" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="781" cy="213" r="3" fill="#c3a6ff" filter="url(#glow)" class="nodePulse"/>

    <circle cx="673" cy="211" r="4" fill="#80ffd5" filter="url(#glow)" class="nodePulse"/>
    <circle cx="888" cy="304" r="4" fill="#c3a6ff" filter="url(#glow)" class="nodePulse"/>
    <circle cx="844" cy="169" r="3" fill="#7bdcf5" filter="url(#glow)" class="nodePulse"/>
    <path d="M650 336H912" stroke="#2b655a" stroke-opacity=".8"/>
    <text x="781" y="365" class="mint" text-anchor="middle" font-size="10" letter-spacing="1.3">HUMAN IDEAS / MACHINE TOOLS</text>
    <text x="781" y="387" class="muted" text-anchor="middle" font-size="10">THINK · BUILD · ITERATE</text>
  </g>

  <g>
    <path d="M32 463H968" stroke="#36796a" stroke-opacity=".72"/>
    <text x="44" y="486" class="muted" font-size="10" letter-spacing="1.1">FOCUS</text>
    <text x="44" y="502" class="mint" font-size="11">FULL-STACK / APPLIED AI / PRODUCT THINKING</text>

    <text x="522" y="486" class="muted" font-size="10" letter-spacing="1.1">BUILD LOOP</text>
    <text x="522" y="502" class="mint" font-size="11">LEARN  →  CREATE  →  SHIP</text>

    <text x="956" y="486" class="muted" text-anchor="end" font-size="10" letter-spacing="1">TRANSMISSION</text>
    <text x="956" y="502" fill="#c3a6ff" text-anchor="end" font-size="11" letter-spacing="1.4">IN PROGRESS <tspan class="cursor">▍</tspan></text>
  </g>
</svg>
