<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
  <title id="title">JARV1S terminal profile</title>
  <desc id="desc">A retro CRT terminal dashboard in black and neon mint, with profile information and ASCII art.</desc>
  <defs>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#75ffe0" opacity=".045"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="570" fill="#020706"/>
  <rect x="18" y="18" width="964" height="534" rx="2" fill="none" stroke="#347d6d" stroke-width="1.4"/>
  <rect x="18" y="18" width="964" height="534" fill="url(#scanlines)"/>

  <g font-family="Consolas, 'Courier New', monospace" fill="#7bceb8">
    <text x="36" y="47" font-size="14" letter-spacing="1.1">JARV1S BIOS (TM)</text>
    <text x="250" y="47" font-size="12" opacity=".8">COPYRIGHT AYAN // 2026</text>
    <text x="615" y="47" font-size="12" opacity=".8">AI ENGINEERING / RESEARCH</text>
    <text x="925" y="47" font-size="12" text-anchor="end">SYS.V1.0</text>
  </g>
  <path d="M32 61H968" stroke="#347d6d" stroke-width="1"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="19" fill="#8affdf" filter="url(#glow)">
    <text x="42" y="91">SUMMARY</text>
    <text x="260" y="91">ABOUT</text>
    <text x="463" y="91">PROJECTS</text>
    <text x="680" y="91">STACK</text>
    <text x="878" y="91">MORE+</text>
  </g>
  <path d="M32 103H968" stroke="#347d6d" stroke-width="1"/>
  <path d="M32 103H155" stroke="#8affdf" stroke-width="2" filter="url(#glow)"/>

  <!-- Left terminal panel -->
  <rect x="32" y="119" width="470" height="340" fill="#030b09" stroke="#347d6d" stroke-width="1.2"/>
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="48" y="143" fill="#4d9b86" font-size="10">/dev/profile/ayan — session active</text>
    <text x="48" y="178" fill="#85ffe0" font-size="25" letter-spacing="1.6" filter="url(#glow)">HELLO, WORLD.</text>
    <text x="48" y="203" fill="#a6e9d8" font-size="12">I BUILD SOFTWARE THAT SOLVES REAL PROBLEMS.</text>
    <text x="48" y="239" fill="#56b49c" font-size="11">&gt; WHOAMI</text>
    <text x="48" y="259" fill="#a4d8cb" font-size="12">AYAN // AI ENGINEERING STUDENT</text>
    <text x="48" y="278" fill="#a4d8cb" font-size="12">FULL-STACK DEVELOPER · AI ENTHUSIAST</text>
    <text x="48" y="297" fill="#a4d8cb" font-size="12">BASED IN KAZAKHSTAN</text>
    <path d="M48 316H480" stroke="#245b4f" stroke-width="1"/>
    <text x="48" y="341" fill="#56b49c" font-size="11">&gt; CURRENT_MISSION</text>
    <text x="48" y="361" fill="#a4d8cb" font-size="12">BUILDING AI-POWERED WEB PRODUCTS</text>
    <text x="48" y="380" fill="#a4d8cb" font-size="12">EXPLORING LLMs, AUTOMATION &amp; UX</text>
    <text x="48" y="399" fill="#a4d8cb" font-size="12">TURNING IDEAS INTO WORKING SYSTEMS</text>
    <path d="M48 418H480" stroke="#245b4f" stroke-width="1"/>
    <text x="48" y="441" fill="#85ffe0" font-size="12">STATUS: <tspan fill="#b4ffe9">ONLINE</tspan><tspan fill="#56b49c">  ▉</tspan></text>
  </g>

  <!-- Right visual panel -->
  <rect x="518" y="119" width="450" height="340" fill="#030b09" stroke="#347d6d" stroke-width="1.2"/>
  <g font-family="Consolas, 'Courier New', monospace" fill="#82f9d9" text-anchor="middle" filter="url(#glow)">
    <text x="743" y="147" font-size="10" letter-spacing="2" opacity=".8">IDENTITY MATRIX // 001</text>
    <text x="743" y="205" font-size="17" xml:space="preserve">      .-========-.       </text>
    <text x="743" y="226" font-size="17" xml:space="preserve">    .'  .----.  '.      </text>
    <text x="743" y="247" font-size="17" xml:space="preserve">   /   / .--. \   \     </text>
    <text x="743" y="268" font-size="17" xml:space="preserve">  |   | (    ) |   |    </text>
    <text x="743" y="289" font-size="17" xml:space="preserve">  |   |  '--'  |   |    </text>
    <text x="743" y="310" font-size="17" xml:space="preserve">   \   \____/   /     </text>
    <text x="743" y="331" font-size="17" xml:space="preserve">    '._      _.'      </text>
    <text x="743" y="352" font-size="17" xml:space="preserve">       '----'          </text>
    <text x="743" y="395" font-size="10" letter-spacing="2" opacity=".8">HUMAN INPUT / MACHINE OUTPUT</text>
    <path d="M565 417h356" stroke="#347d6d" stroke-width="1"/>
    <text x="743" y="440" font-size="11" letter-spacing="1.3">THINK  /  BUILD  /  ITERATE</text>
  </g>

  <!-- Bottom status strip -->
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="37" y="488" fill="#4d9b86" font-size="11">CHANNEL_01</text>
    <text x="37" y="510" fill="#83f8d7" font-size="15" filter="url(#glow)">AI / SOFTWARE / SYSTEMS</text>
    <text x="37" y="532" fill="#4d9b86" font-size="10">NO MAGIC. JUST ITERATION.</text>

    <text x="352" y="488" fill="#4d9b86" font-size="11">CHANNEL_02</text>
    <text x="352" y="510" fill="#83f8d7" font-size="15" filter="url(#glow)">LEARN  //  CREATE  //  SHIP</text>
    <text x="352" y="532" fill="#4d9b86" font-size="10">OPEN TO INTERESTING COLLABORATIONS</text>

    <text x="958" y="488" fill="#4d9b86" font-size="10" text-anchor="end">END OF TRANSMISSION</text>
    <text x="958" y="526" fill="#83f8d7" font-size="25" text-anchor="end" letter-spacing="2" filter="url(#glow)">JARV1S</text>
    <text x="958" y="541" fill="#4d9b86" font-size="9" text-anchor="end">© AYAN</text>
  </g>
</svg>
